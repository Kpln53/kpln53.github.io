<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0c1016">
    <title>Panel | Ti App Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/images/ti-logo.png" type="image/png">
</head>
<body>
    <a class="skip" href="#icerik">İçeriğe geç</a>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="/" aria-label="Ti App Studio ana sayfa" data-i18n-aria="brand.home">
                <img class="brand-mark" src="/images/ti-logo.png" alt="">
                <span class="brand-name">App Studio</span>
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menü</button>
            <nav id="site-nav" class="site-nav" aria-label="Ana menü">
                <a href="/">Ana Sayfa</a>
                <a href="/games">Oyunlar</a>
                <a href="/about">Hakkımızda</a>
                <a href="/news">Haberler</a>
                <a href="/contact">İletişim</a>
            </nav>
            <div class="header-actions" data-auth-slot>
                <a class="header-login" href="/login">Giriş yap</a>
            </div>
        </div>
    </header>

    <main id="icerik" class="wrap admin-layout" hidden>
        <h1>Panel</h1>
        <p class="lead" id="admin-email"></p>
        <div class="admin-tabs" role="tablist">
            <button class="admin-tab is-on" type="button" data-tab="news">Haberler</button>
            <button class="admin-tab" type="button" data-tab="games">Oyunlar</button>
            <button class="admin-tab" type="button" data-tab="site">Bilgiler</button>
            <button class="admin-tab" type="button" data-tab="users">Kullanıcılar</button>
            <button class="admin-tab" type="button" data-tab="feedback">Geri bildirim</button>
        </div>
        <p id="admin-status" class="form-status" role="status"></p>
        <div id="admin-view"></div>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <div>
                <p class="footer-brand">Ti App Studio</p>
                <p class="muted">Oyun ve uygulama stüdyosu.</p>
            </div>
            <nav class="footer-nav" aria-label="Alt menü">
                <a href="/">Ana Sayfa</a>
                <a href="/games">Oyunlar</a>
                <a href="/about">Hakkımızda</a>
                <a href="/news">Haberler</a>
                <a href="/contact">İletişim</a>
            </nav>
        </div>
        <div class="wrap footer-bottom">
            <p>© <span data-year>2026</span> Ti App Studio</p>
        </div>
    </footer>
    <script src="/js/i18n.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth-ui.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
