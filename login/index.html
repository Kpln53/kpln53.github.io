<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ti App Studio hesabına giriş yap.">
    <meta name="theme-color" content="#0c1016">
    <title>Giriş yap | Ti App Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/images/ti-logo.png" type="image/png">
</head>
<body>
    <a class="skip" href="#icerik">İçeriğe geç</a>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="/" aria-label="Ti App Studio ana sayfa" data-i18n-aria="brand.home">
                <img class="brand-mark" src="/images/ti-logo.png" alt="">
                <span class="brand-name">App Studio</span>
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menü</button>
            <nav id="site-nav" class="site-nav" aria-label="Ana menü">
                <a href="/">Ana Sayfa</a>
                <a href="/games">Oyunlar</a>
                <a href="/about">Hakkımızda</a>
                <a href="/news">Haberler</a>
                <a href="/contact">İletişim</a>
            </nav>
            <div class="header-actions" data-auth-slot>
                <a class="header-login" href="/login">Giriş yap</a>
            </div>
        </div>
    </header>

    <main id="icerik" class="wrap auth-layout">
        <h1 data-i18n="auth.login">Giriş yap</h1>
        <p class="lead" data-i18n="auth.loginLead">Hesabınla devam et.</p>
        <div class="contact-form">
            <div data-google-slot class="google-slot"></div>
            <button class="google-btn" type="button" data-google data-i18n="auth.google">Google ile devam et</button>
            <p class="auth-split" data-i18n="auth.or">veya</p>
            <form id="login-form" method="post" action="/api/login">
                <div class="contact-form" style="padding:0;border:0;background:transparent;">
                    <label class="field">
                        <span data-i18n="auth.email">E-posta</span>
                        <input type="email" name="email" autocomplete="username" required>
                    </label>
                    <label class="field">
                        <span data-i18n="auth.password">Şifre</span>
                        <input type="password" name="password" autocomplete="current-password" required>
                    </label>
                    <p class="form-status" role="status"></p>
                    <button class="btn btn-primary" type="submit" data-i18n="auth.login">Giriş yap</button>
                    <p class="auth-switch"><span data-i18n="auth.noAccount">Hesabın yok mu?</span> <a href="/register" data-i18n="auth.register">Kayıt ol</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <div>
                <p class="footer-brand">Ti App Studio</p>
                <p class="muted">Oyun ve uygulama stüdyosu.</p>
            </div>
            <nav class="footer-nav" aria-label="Alt menü">
                <a href="/">Ana Sayfa</a>
                <a href="/games">Oyunlar</a>
                <a href="/about">Hakkımızda</a>
                <a href="/news">Haberler</a>
                <a href="/contact">İletişim</a>
            </nav>
        </div>
        <div class="wrap footer-bottom">
            <p>© <span data-year>2026</span> Ti App Studio</p>
        </div>
    </footer>
    <script src="/js/i18n.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth-ui.js"></script>
    <script src="/js/auth-forms.js"></script>
</body>
</html>
